<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">ARC and Flux delivery architecture</title>
  <desc id="desc">GitHub Actions sends jobs to the ARC listener and controller, which create an ephemeral runner. The runner pushes to Gitea. Flux scans the image, updates Git, and deploys the journaling application to k3s.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b172a"/><stop offset="1" stop-color="#122a43"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".25"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#38bdf8"/></marker></defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="55" y="58" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="24" font-weight="700">EPHEMERAL CI AND GITOPS DELIVERY LOOP</text>
  <text x="55" y="88" fill="#94a3b8" font-family="Arial,sans-serif" font-size="16">One job, one disposable builder; Git remains the deployment authority.</text>
  <g font-family="Arial,sans-serif" filter="url(#shadow)">
    <g><rect x="55" y="145" width="220" height="105" rx="16" fill="#162b46" stroke="#60a5fa" stroke-width="2"/><text x="165" y="187" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">GitHub Actions</text><text x="165" y="218" text-anchor="middle" fill="#a8c7ef" font-size="15">Repository job queue</text></g>
    <g><rect x="365" y="145" width="220" height="105" rx="16" fill="#162b46" stroke="#60a5fa" stroke-width="2"/><text x="475" y="187" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">ARC Listener</text><text x="475" y="218" text-anchor="middle" fill="#a8c7ef" font-size="15">Long-poll connection</text></g>
    <g><rect x="675" y="145" width="220" height="105" rx="16" fill="#162b46" stroke="#60a5fa" stroke-width="2"/><text x="785" y="187" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">ARC Controller</text><text x="785" y="218" text-anchor="middle" fill="#a8c7ef" font-size="15">Kubernetes reconciler</text></g>
    <g><rect x="675" y="335" width="220" height="115" rx="16" fill="#123b3f" stroke="#2dd4bf" stroke-width="2"/><text x="785" y="375" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">Ephemeral Runner</text><text x="785" y="405" text-anchor="middle" fill="#99f6e4" font-size="15">runner + Docker daemon</text><text x="785" y="430" text-anchor="middle" fill="#99f6e4" font-size="14">one pod · one job</text></g>
    <g><rect x="945" y="335" width="200" height="115" rx="16" fill="#3b2a16" stroke="#f59e0b" stroke-width="2"/><text x="1045" y="375" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">Gitea Registry</text><text x="1045" y="405" text-anchor="middle" fill="#fde68a" font-size="15">Private image store</text></g>
    <g><rect x="55" y="465" width="220" height="100" rx="16" fill="#162b46" stroke="#a78bfa" stroke-width="2"/><text x="165" y="505" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">Git Repository</text><text x="165" y="535" text-anchor="middle" fill="#ddd6fe" font-size="15">Desired image tag</text></g>
    <g><rect x="365" y="465" width="220" height="100" rx="16" fill="#162b46" stroke="#a78bfa" stroke-width="2"/><text x="475" y="505" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">Flux Controllers</text><text x="475" y="535" text-anchor="middle" fill="#ddd6fe" font-size="15">Scan · commit · reconcile</text></g>
    <g><rect x="945" y="485" width="200" height="80" rx="16" fill="#162b46" stroke="#34d399" stroke-width="2"/><text x="1045" y="518" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Journal App</text><text x="1045" y="544" text-anchor="middle" fill="#a7f3d0" font-size="14">k3s workload</text></g>
  </g>
  <g fill="none" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"><path d="M275 197h78"/><path d="M585 197h78"/><path d="M785 250v72"/><path d="M895 392h38"/><path d="M1045 450v23"/><path d="M945 525H598"/><path d="M365 515h-77"/><path d="M165 465V270c0-12 10-20 22-20h166"/></g>
  <g font-family="Arial,sans-serif" font-size="13" fill="#7dd3fc"><text x="297" y="183">assign</text><text x="612" y="183">scale</text><text x="798" y="294">create</text><text x="903" y="378">push</text><text x="786" y="509">scan</text><text x="298" y="500">commit</text></g>
</svg>
